name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'webapp/crags.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'webapp/crags.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate crag data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Keep malformed crag records from reaching production. The full regression suite\n      # remains available locally, but legacy web-app parity tests are not a deploy gate.\n      - run: npm run validate:crags

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy sendtemps-api Worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            VAPID_SUBJECT
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_SUBJECT: "mailto:hello@sendtemps.app"
