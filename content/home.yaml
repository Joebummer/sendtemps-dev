      today/tomorrow"
    - "**Full sub-crag breakdown** – See individual walls/sectors under a
      destination crag, with the best-scoring one automatically surfaced"
    - "**Multi-day and weekend trip planning** – At-a-glance “Weekend away” pick
      and full destination-based trip scoring section"
    - "**Push notifications** – Rare-window and favourite-crag threshold alerts
      sent to your device"
  cta_label: Get Pro
